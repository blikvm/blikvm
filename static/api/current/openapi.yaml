  /api/v1/video/edid:
    get:
      tags: [stream]
      summary: Get EDID selection, write capability, bridge presets and latest operation
      description: >-
        data includes edid (hex), file (uploaded basename), writable, presets
        (bridge-specific reference profiles or null), and operation (null or an
        object with id, state, error, startedAt, finishedAt, hardwareApplied).
        Operation state is running, succeeded or failed. Poll this endpoint
        after a Flash operation receives HTTP 202. IDs are scoped to the
        current application process; after a restart reload the actual EDID.
      operationId: getVideoEDID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: EDID
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Missing or invalid token
    post:
      tags: [stream]
      summary: Apply EDID hex or an uploaded profile (administrator only)
      description: >-
        Choose exactly one of edid or file. Ordinary receivers apply
        synchronously. Flash-backed receivers return 202 immediately and
        continue verification and RESET independently of the HTTP connection.
        Poll GET /api/v1/video/edid for the result; do not retry a mutation
        merely because a connection was interrupted. Keep device power on.
      operationId: postVideoEDID
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                edid:
                  type: string
                  description: EDID as hexadecimal data
                file:
                  type: string
                  description: Uploaded .bin basename from the profile list
              oneOf:
                - required: [edid]
                - required: [file]
      responses:
        '200':
          description: EDID applied and saved synchronously
          content:
            application/json:
              schema:
                type: object
        '202':
          description: >-
            Flash operation accepted. data.operation contains its id and
            running state. Success is not established until polling reports
            succeeded; hardwareApplied can be true even if saving the
            selection failed.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
