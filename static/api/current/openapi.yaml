        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BliKVM API Token
  schemas:
    BootloaderPrerequisite:
      type: object
      required: [required, canUpdate]
      properties:
        required:
          type: boolean
          description: The running Pi boot firmware cannot safely perform the paired A/B update.
        canUpdate:
          type: boolean
          description: Verified CM4 hardware and this signed App provide the supported automatic maintenance path.
        currentVersion: {type: string, format: date}
        recommendedVersion: {type: string, format: date}
        reason: {type: string}
    UpdateTask:
      type: object
      required: [id, track, state, sourceVersion, bundleSha256, bundleName, startedAt, updatedAt, logs, checks]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{32}$'}
        sequence: {type: integer, format: int64, minimum: 0}
        track: {type: string, enum: [application, system]}
        state:
          type: string
          enum: [bootloader, verifying, installing, restarting, checking, staged, committed, rolled_back, failed, attention]
          description: Attention requires operator recovery and must not be silently dismissed or retried.
        bootloaderPhase:
          type: string
          description: Actual EEPROM journal phase, for example preparing, maintenance_reboot, backing_up, writing, verified, verifying_reboot, ready or failed.
        sourceVersion: {type: string}
        targetVersion: {type: string}
        sourceSlot: {type: string}
        targetSlot: {type: string}
        bundleSha256: {type: string}
        bundleName: {type: string}
        startedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        reason: {type: string}
        logs:
          type: array
          items: {type: string}
        checks:
          type: array
          items:
            type: object
            required: [name, result]
            properties:
              name: {type: string}
              result: {type: string}
              detail: {type: string}
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
    SystemUpdateBundle:
      type: object
      required: [name, sizeBytes, uploadedAt]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        type:
          type: string
          enum: [system-ab]
        sha256:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        rememberDevice:
          type: boolean
          default: false
    LoginResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [expiresAt, user]
          properties:
            expiresAt:
              type: string
              format: date-time
            rememberDevice:
              type: boolean
            user:
              type: object
              required: [username]
              properties:
                username:
                  type: string
    ControlResponse:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            held: { type: boolean }
            mine: { type: boolean }
            owner: { type: string }
            required: { type: boolean, enum: [false] }
            mode: { type: string, enum: [shared] }
            authEnabled: { type: boolean }
    MeResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [username, exp, iat]
          properties:
            role: { type: string, enum: [admin, operator, viewer] }
            authEnabled: { type: boolean }
            permissions: { type: array, items: { type: string } }
            username:
              type: string
            exp:
              type: integer
              format: int64
            iat:
              type: integer
              format: int64
    ApiTokenCreateRequest:
      type: object
      required: [name]
      properties:
        permissions:
          type: array
          items: { type: string }
          description: Subset of current account permissions. Omitted snapshots current permissions; empty array grants none. Effective permissions are intersected with current account permissions.
        name:
          type: string
          maxLength: 80
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    ApiTokenMetadata:
      type: object
      required: [id, name, subject, createdAt, expiresAt]
      properties:
        permissions: { type: array, items: { type: string } }
        id: { type: string }
        name: { type: string }
        subject: { type: string }
        createdAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        lastUsedAt: { type: integer, format: int64 }
        revokedAt: { type: integer, format: int64 }
    ApiTokenCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [token, tokenInfo]
          properties:
            token: { type: string }
            tokenInfo:
              $ref: '#/components/schemas/ApiTokenMetadata'
    ApiTokenListResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [tokens]
          properties:
            tokens:
              type: array
              items:
                $ref: '#/components/schemas/ApiTokenMetadata'
    HealthResponse:
      type: object
      required: [ok, listen, pid, uptimeSec, stream]
      properties:
        ok:
          type: boolean
        listen:
          type: string
        pid:
          type: integer
          format: int64
        uptimeSec:
          type: integer
          format: int64
        stream:
          type: object
          additionalProperties: true
    StreamStatusResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [pid, listen, startedAt, uptimeSec, stream, rates]
          properties:
            pid:
              type: integer
              format: int64
            listen:
              type: string
            startedAt:
              type: string
              format: date-time
            uptimeSec:
              type: integer
              format: int64
            stream:
              type: object
              additionalProperties: true
            rates:
              type: object
              additionalProperties:
                type: number
                format: double
    IdrResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [atUnixMs]
          properties:
            atUnixMs:
              type: integer
              format: int64
    SystemMetricsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [uptimeSec, pid, system]
          properties:
            uptimeSec:
              type: integer
              format: int64
            pid:
              type: integer
              format: int64
            system:
              type: object
              additionalProperties: true
    RestartResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [restarting, atUnixMs]
          properties:
            restarting:
              type: boolean
            atUnixMs:
              type: integer
              format: int64

    NetworkInterface:
      type: object
      required: [iface, type, mac, ip4, ip6, dhcp]
      properties:
        iface:
          type: string
        type:
          type: string
          description: wired|wifi
        mac:
          type: string
        ip4:
          type: string
          description: IPv4 with CIDR (e.g. 192.168.0.3/24)
        ip6:
          type: array
          description: Assigned IPv6 addresses in CIDR notation, including link-local addresses; tentative and failed addresses are excluded.
          items:
            type: string
          example: ["fd12::10/64", "fe80::20/64"]
        dhcp:
          type: boolean

    NetworkGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [protocol, http_port, https_port, interfaces]
          properties:
            protocol:
              type: string
              enum: [http, https]
            http_port:
              type: integer
              format: int32
            https_port:
              type: integer
              format: int32
            interfaces:
              type: array
              items:
                $ref: '#/components/schemas/NetworkInterface'

    RemoteAccessUplinkCandidate:
      type: object
      required: [device, type, state]
      properties:
        device:
          type: string
        connection:
          type: string
          nullable: true
        type:
          type: string
          description: nmcli device type (wifi|ethernet)
        state:
          type: string

    RemoteAccessDefaultRoute:
      type: object
      properties:
        via:
          type: string
          nullable: true
        dev:
          type: string
          nullable: true
        metric:
          type: integer
          format: int32
          nullable: true

    RemoteAccessUplinkGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [preferredInterface, candidates, defaultRoutes]
          properties:
            preferredInterface:
              type: string
            candidates:
