                      busy: {type: boolean}
                      deviceTime: {type: string, format: date-time}
                      task:
                        allOf:
                          - $ref: '#/components/schemas/UpdateTask'
                        nullable: true
                      capabilities:
                        type: object
                        properties:
                          tasks: {type: boolean}
                          signedAudit: {type: boolean, enum: [false]}
                          versionFloor: {type: boolean, enum: [false]}
        '401':
