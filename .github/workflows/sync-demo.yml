name: Sync latest frontend demo

on:
  workflow_dispatch:

# The reusable website deployment writes only the generated gh-pages branch.
# Source changes to protected master continue to require a pull request.
permissions:
  contents: write

concurrency:
  group: sync-frontend-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy.yml
    with:
      source-ref: master
    secrets: inherit
