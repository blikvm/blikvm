name: Refresh public update index
on:
  release:
    types: [published, edited, deleted, unpublished, released, prereleased]
  workflow_run:
    workflows: [Mirror firmware to AtomGit]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: public-update-index
  cancel-in-progress: false
jobs:
  index:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/sync-update-index.test.mjs
      - name: Refresh from published Release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-update-index.mjs
      - name: Deploy website with refreshed index
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
