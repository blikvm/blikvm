name: Mirror firmware to AtomGit
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to mirror
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: atomgit-firmware-mirror-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'blikvm/blikvm'
    # Set ATOMGIT_RUNNER to the label of a trusted runner with good AtomGit connectivity.
    runs-on: ${{ vars.ATOMGIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Sync and verify firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          SOURCE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/mirror-atomgit-release.py "$SOURCE_TAG"
