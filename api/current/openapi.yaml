openapi: 3.0.3
info:
  title: BlikVM Go API
  version: 1.0.0
  description: |
    OpenAPI contract for the native Go KVM backend.
    With authentication enabled, all protected routes enforce current account permissions.
    Unknown routes require device.configure. Authorized users operate immediately,
    without acquiring or renewing a control lease. Multiple authorized clients may
    operate concurrently. RBAC is inactive
    when authentication is disabled. Legacy readonly accounts migrate to viewer;
    legacy sessions and API tokens must be reissued after upgrade.
servers:
  - url: /
tags:
  - name: auth
  - name: stream
  - name: device
  - name: network
  - name: remote-access
  - name: vpn
  - name: wol
  - name: msd
  - name: hid
  - name: prometheus
  - name: account
  - name: display
  - name: system
  - name: application
paths:
  /api/v1/session/control:
    get:
      x-permission: self
      deprecated: true
      tags: [auth]
      summary: Compatibility status for legacy clients; no acquisition required
      operationId: getControlLease
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Shared input mode, required=false; mine indicates action permission only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlResponse' }
    post:
      x-permission: self
      deprecated: true
      tags: [auth]
      summary: Compatibility no-op for legacy acquisition calls
      operationId: postControlLease
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: No owner or lease is created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlResponse' }
        '401': { description: Invalid credentials }
        '403': { description: Missing action permission }
  /api/v1/auth/password:
    post:
      x-permission: self
      tags: [account]
      summary: Change own password and revoke own credentials
      description: Browser session required. Success requires login again.
      operationId: postOwnPassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { description: Password changed; data.loginRequired is true }
        '400': { description: Invalid request }
        '401': { description: Invalid current password or session }
        '403': { description: Browser session required }
  /api/v1/auth/user/reset-2fa:
    post:
      x-permission: accounts.manage
      tags: [account]
      summary: Reset a specific account's TOTP and revoke its credentials
      description: Requires administrator browser session, administrator password and administrator TOTP if enabled.
      operationId: postResetUser2FA
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                code: { type: string, description: Administrator's own TOTP when enabled }
      responses:
        '200': { description: Reset succeeded }
        '400': { description: Invalid request or unknown account }
        '401': { description: Reauthentication failed }
        '403': { description: Administrator browser session required }
  /api/v1/audit:
    get:
      x-permission: audit.read
      tags: [account]
      summary: Read the most recent 500 security audit events
      operationId: getSecurityAudit
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Persistent bounded event log; contains no passwords, tokens or input contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            time: { type: string, format: date-time }
                            user: { type: string }
                            action: { type: string }
                            target: { type: string }
        '403': { description: audit.read required }
  /healthz:
    get:
      x-permission: device.configure
      summary: Health check
      operationId: getHealthz
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      security: []
      x-permission: public
      tags: [auth]
      summary: Login and create a server-side browser session
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/state:
    get:
      security: []
      x-permission: public
      tags: [auth]
      summary: Get global auth state (whether login is required)
      operationId: getAuthState
      responses:
        '200':
          description: Auth state
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [enabled]
                    properties:
                      enabled:
                        type: boolean
  /api/v1/auth/logout-all:
    post:
      x-permission: self
      tags: [auth]
      summary: Revoke all sessions and API tokens for the current user
      operationId: postAuthLogoutAll
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All credentials revoked
        '401':
          description: Missing or invalid token
  /api/v1/auth/api-tokens:
    get:
      x-permission: self
      tags: [auth]
      summary: List the current user's API tokens
      operationId: getAuthApiTokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API token metadata (never token secrets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenListResponse'
        '401':
          description: Missing or invalid token
    post:
      x-permission: self
      tags: [auth]
      summary: Create an API token
      operationId: postAuthApiToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreateRequest'
      responses:
        '201':
          description: Token secret, returned only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreateResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
  /api/v1/auth/api-tokens/{id}:
    delete:
      x-permission: self
      tags: [auth]
      summary: Revoke one API token
      operationId: deleteAuthApiToken
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Token revoked
        '401':
          description: Missing or invalid token
        '404':
          description: Token not found
  /api/v1/auth/me:
    get:
      x-permission: self
      tags: [auth]
      summary: Return current auth session
      operationId: getAuthMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      x-permission: self
      tags: [auth]
      summary: Logout and clear auth cookie
      operationId: postAuthLogout
      responses:
        '200':
          description: Logout success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/v1/mic:
    get:
      x-permission: audio.send
      tags: [device]
      summary: Get microphone (audio-in) registration state
      operationId: getMic
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mic state
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [enabled]
                    properties:
                      enabled:
                        type: boolean
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-permission: device.configure
      tags: [device]
      summary: Set microphone (audio-in) registration state
      operationId: postMic
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated mic state
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [enabled]
                    properties:
                      enabled:
                        type: boolean
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/network:
    get:
      x-permission: device.configure
      tags: [network]
      summary: Network state (ports, protocol, interfaces)
      operationId: getNetwork
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Network state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkGetResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/hostname:
    post:
      x-permission: device.configure
      tags: [network]
      summary: Set hostname
      operationId: postHostname
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname:
                  type: string
      responses:
        '200':
          description: Hostname updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [hostname]
                    properties:
                      hostname:
                        type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cloud:
    get:
      x-permission: device.configure
      tags: [remote-access]
      summary: Cloud binding and connection status (local device administrator only)
      operationId: getCloudStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status; device secret is never returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      url: { type: string }
                      deviceId: { type: string }
                      connected: { type: boolean }
                      error: { type: string }
        '401': { description: Device login required }
        '403': { description: Administrator required }
        '409': { description: Enable device authentication first }
    post:
      x-permission: device.configure
      tags: [remote-access]
      summary: Bind, enable, disable or unbind cloud access
      operationId: configureCloudAccess
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [bind, enable, unbind] }
                url: { type: string, description: HTTPS cloud origin for bind }
                code: { type: string, description: Single-use pairing code for bind }
                enabled: { type: boolean, description: Used with enable action }
      responses:
        '200': { description: Configuration applied }
        '400': { description: Invalid configuration or cloud rejected request }
        '401': { description: Device login required }
        '403': { description: Administrator required }
        '409': { description: Enable device authentication first }
  /api/v1/remote-access/port-forwarding:
    get:
      x-permission: device.configure
      tags: [remote-access]
      summary: Saved and active WebRTC fixed UDP port configuration (administrator only)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Configuration, active configuration, transportReady and restartRequired }
        '401': { description: Device login required }
        '403': { description: Administrator required }
    put:
      x-permission: device.configure
      tags: [remote-access]
      summary: Save fixed UDP port configuration; restart the service to apply
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, udpPort, publicIPv4]
              properties:
                enabled: { type: boolean, default: false }
                udpPort: { type: integer, minimum: 1024, maximum: 65535, default: 20000 }
                publicIPv4: { type: string, description: Optional advertised IPv4; ignored when disabled }
      responses:
        '200': { description: Saved atomically; restartRequired indicates whether to restart }
        '400': { description: Invalid configuration }
        '401': { description: Device login required }
        '403': { description: Administrator required }
        '409': { description: Port unavailable or authentication disabled }
  /api/v1/remote-access/uplink:
    get:
      x-permission: device.configure
      tags: [remote-access]
      summary: Uplink candidates and default routes
      operationId: getRemoteAccessUplink
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Uplink status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoteAccessUplinkGetResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-permission: device.configure
      tags: [remote-access]
      summary: Set preferred uplink interface
      operationId: postRemoteAccessUplink
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferredInterface]
              properties:
                preferredInterface:
                  type: string
      responses:
        '200':
          description: Preference stored
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [preferredInterface]
                    properties:
                      preferredInterface:
                        type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/wol:
    get:
      x-permission: kvm.view
      tags: [wol]
      summary: List Wake-on-LAN devices
      operationId: getWol
      security:
        - bearerAuth: []
      responses:
        '200':
          description: WOL devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WolListResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      x-permission: device.configure
      tags: [wol]
      summary: Remove Wake-on-LAN device
      operationId: deleteWol
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac]
              properties:
                mac:
                  type: string
      responses:
        '200':
          description: Updated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WolListResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: postNativeApiV1Wol
      summary: POST /api/v1/wol
      x-permission: device.configure
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Operation result
        '401':
          description: Authentication required
        '403':
          description: Permission denied
  /api/v1/wol/send:
    post:
      x-permission: host.power
      tags: [wol]
      summary: Send magic packet
      operationId: postWolSend
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac]
              properties:
                mac:
                  type: string
      responses:
        '200':
          description: Packet sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/vpn:
    get:
      x-permission: device.configure
      tags: [vpn]
      summary: Get VPN service states
      operationId: getVpn
      security:
        - bearerAuth: []
      responses:
        '200':
          description: VPN states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VPNGetResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-permission: device.configure
      tags: [vpn]
      summary: Enable/disable a VPN service unit
      operationId: postVpnToggle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vpn, active]
              properties:
                vpn:
                  type: string
                active:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/vpn/wireguard/config:
    get:
      x-permission: device.configure
      tags: [vpn]
      summary: Get WireGuard wg0 config status
      operationId: getWireguardConfig
      parameters:
        - in: query
          name: download
          required: false
          schema:
            type: boolean
          description: When true, downloads the current wg0.conf file instead of returning JSON status.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: WireGuard status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireGuardConfigResponse'
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-permission: device.configure
      tags: [vpn]
      summary: Upload WireGuard wg0 config
      operationId: postWireguardConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, enable, restartIfActive]
              properties:
                config:
                  type: string
                enable:
                  type: boolean
                restartIfActive:
                  type: boolean
      responses:
        '200':
          description: WireGuard status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WireGuardConfigResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/vpn/tailscale/config:
    get:
      x-permission: device.configure
      tags: [vpn]
      summary: Get Tailscale config and runtime status
      operationId: getTailscaleConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tailscale config and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailscaleConfigResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-permission: device.configure
      tags: [vpn]
      summary: Save Tailscale config
      operationId: postTailscaleConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TailscaleConfigInput'
      responses:
        '200':
          description: Tailscale config and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TailscaleConfigResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/vpn/zerotier/config:
    get:
      x-permission: device.configure
      tags: [vpn]
      summary: Get ZeroTier config and runtime status
      operationId: getZerotierConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ZeroTier config and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZeroTierConfigResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-permission: device.configure
      tags: [vpn]
      summary: Save ZeroTier config
      operationId: postZerotierConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZeroTierConfigInput'
      responses:
        '200':
          description: ZeroTier config and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZeroTierConfigResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Config file not found
  /api/v1/prometheus/state:
    get:
      x-permission: device.configure
      tags: [prometheus]
      summary: Get Prometheus exporter state
      operationId: getPrometheusState
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Prometheus state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusStateResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/prometheus:
    post:
      x-permission: device.configure
      tags: [prometheus]
      summary: Enable/disable Prometheus exporter
      operationId: postPrometheus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enable]
              properties:
                enable:
                  type: boolean
      responses:
        '200':
          description: Prometheus state
          content:
