  /api/v1/stream/h264/webrtc:
    options:
      operationId: whepH264Options
      summary: Native H264 WHEP preflight
      x-permission: kvm.view
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Supported request methods and headers }
        '401': { description: Authentication required }
        '403': { description: Required permission missing }
    post:
      operationId: whepH264Post
      summary: Create a native H264 WHEP session
      description: Use only codecs advertised by the capabilities endpoint. Sends video from the shared media source; audio additionally requires audio.listen. Delete the session using its returned Location URL. Trickle ICE PATCH is not supported.
      x-permission: kvm.view
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/sdp:
            schema: { type: string, minLength: 1, maxLength: 1048576 }
      responses:
        '201':
          description: SDP answer and session URL
          headers:
            Location:
              description: URL for deleting this session
              schema: { type: string }
          content:
            application/sdp:
              schema: { type: string }
        '400': { description: Invalid SDP offer }
        '401': { description: Authentication required }
        '403': { description: Required permission missing }
        '500': { description: WebRTC codec or session setup failed }
        '503': { description: Configured fixed UDP transport is unavailable }
    delete:
      operationId: whepH264Delete
      summary: Legacy WHEP DELETE without a session suffix
      description: Returns 204 without closing a session. Use the Location URL returned by POST for actual session cleanup.
      x-permission: kvm.view
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: No session suffix; no operation performed }
        '401': { description: Authentication required }
        '403': { description: Required permission missing }
