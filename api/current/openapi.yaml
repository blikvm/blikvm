  /api/v1/updates/tasks:
    post:
      x-permission: device.update
      tags: [system]
      summary: Start an administrator-authorized signed update task
      operationId: createUpdateTask
      description: Upload the matching track first, then bind the task to that exact SHA-256. System tasks requiring CM4 EEPROM maintenance return 428 until explicit consent is provided. Supported firmware uses the normal update flow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track, sha256]
              properties:
                track: {type: string, enum: [application, system]}
                sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                eepromConsent:
                  type: boolean
                  default: false
                  description: Explicit operator consent to the reported CM4 boot firmware maintenance. Never infer consent from uploading a system bundle.
      responses:
        '202':
          description: Durable asynchronous task created
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: {type: boolean, enum: [true]}
                  data:
                    $ref: '#/components/schemas/UpdateTask'
        '400':
          description: Invalid track/request or no matching uploaded bundle
        '401':
          description: Authentication required
        '403':
          description: Administrator permission required
        '409':
          description: Bundle changed, another operation is active, maintenance is unavailable, or an earlier uncertain task needs operator review
        '428':
          description: Explicit CM4 EEPROM maintenance consent is required; no task is started
          content:
            application/json:
              schema:
                type: object
                required: [ok, error, code, data]
                properties:
                  ok: {type: boolean, enum: [false]}
                  error: {type: string}
                  code: {type: string, enum: [bootloader_consent_required]}
                  data:
                    $ref: '#/components/schemas/BootloaderPrerequisite'
        '500':
          description: Durable state could not be read or persisted
