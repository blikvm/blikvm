            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Operation result. Streaming and download endpoints return their native payload.
        '400':
          description: Invalid request parameters
        '401':
          description: Authentication required
        '403':
          description: Required permission missing
    put:
      x-permission: device.configure
      operationId: putApiV1VideoWebrtc
      summary: PUT /api/v1/video/webrtc
      description: Native backend endpoint. Requires the permission declared by x-permission when authentication is enabled.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Operation result. Streaming and download endpoints return their native payload.
        '400':
          description: Invalid request parameters
        '401':
          description: Authentication required
        '403':
          description: Required permission missing
  /api/v1/switch/{id}/activate:
    post:
      summary: Activate HDMI switch
      operationId: postSwitchActivate
      x-permission: device.configure
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                isActive: { type: boolean }
      responses:
        '200': { description: Updated switch state }
        '400': { description: Invalid switch action or configuration }
        '401': { description: Authentication required }
        '403': { description: Required permission missing }
  /api/v1/switch/{id}/channel:
    post:
      summary: Channel HDMI switch
      operationId: postSwitchChannel
      x-permission: switch.select
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                channel: { type: integer }
      responses:
        '200': { description: Updated switch state }
        '400': { description: Invalid switch action or configuration }
        '401': { description: Authentication required }
        '403': { description: Required permission missing }
  /api/v1/switch/{id}/update:
    post:
      summary: Update HDMI switch
      operationId: postSwitchUpdate
      x-permission: device.configure
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                title: { type: string }
      responses:
        '200': { description: Updated switch state }
        '400': { description: Invalid switch action or configuration }
        '401': { description: Authentication required }
        '403': { description: Required permission missing }
  /api/v1/stream/h264/webrtc/{sessionId}:
    delete:
      summary: Close a H264 WHEP session
      operationId: deleteH264WhepSession
      description: Use the Location URL returned when the SDP offer was accepted. Session ownership is enforced.
      x-permission: kvm.view
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session closed or already absent }
        '401': { description: Authentication required }
        '403': { description: Session belongs to another principal }
  /api/v1/stream/h265/webrtc/{sessionId}:
    delete:
      summary: Close a H265 WHEP session
      operationId: deleteH265WhepSession
      description: Use the Location URL returned when the SDP offer was accepted. Session ownership is enforced.
      x-permission: kvm.view
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session closed or already absent }
        '401': { description: Authentication required }
        '403': { description: Session belongs to another principal }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BliKVM API Token
  schemas:
    BootloaderPrerequisite:
      type: object
      required: [required, canUpdate]
      properties:
        required:
          type: boolean
          description: The running Pi boot firmware cannot safely perform the paired A/B update.
        canUpdate:
          type: boolean
          description: Verified CM4 hardware and this signed App provide the supported automatic maintenance path.
        currentVersion: {type: string, format: date}
        recommendedVersion: {type: string, format: date}
        reason: {type: string}
    UpdateTask:
      type: object
      required: [id, track, state, sourceVersion, bundleSha256, bundleName, startedAt, updatedAt, logs, checks]
      properties:
        id: {type: string, pattern: '^[0-9a-f]{32}$'}
        sequence: {type: integer, format: int64, minimum: 0}
        track: {type: string, enum: [application, system]}
        state:
          type: string
          enum: [bootloader, verifying, installing, restarting, checking, staged, committed, rolled_back, failed, attention]
          description: Attention requires operator recovery and must not be silently dismissed or retried.
        bootloaderPhase:
          type: string
          description: Actual EEPROM journal phase, for example preparing, maintenance_reboot, backing_up, writing, verified, verifying_reboot, ready or failed.
        sourceVersion: {type: string}
        targetVersion: {type: string}
        sourceSlot: {type: string}
        targetSlot: {type: string}
        bundleSha256: {type: string}
        bundleName: {type: string}
        startedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        reason: {type: string}
        logs:
          type: array
          items: {type: string}
        checks:
          type: array
          items:
            type: object
            required: [name, result]
            properties:
              name: {type: string}
              result: {type: string}
              detail: {type: string}
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
    SystemUpdateBundle:
      type: object
      required: [name, sizeBytes, uploadedAt]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        type:
          type: string
          enum: [system-ab]
        sha256:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        rememberDevice:
          type: boolean
          default: false
    LoginResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [expiresAt, user]
          properties:
            expiresAt:
              type: string
              format: date-time
            rememberDevice:
              type: boolean
            user:
              type: object
              required: [username]
              properties:
                username:
                  type: string
    ControlResponse:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            held: { type: boolean }
            mine: { type: boolean }
            owner: { type: string }
            required: { type: boolean, enum: [false] }
            mode: { type: string, enum: [shared] }
            authEnabled: { type: boolean }
    MeResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [username, exp, iat]
          properties:
            role: { type: string, enum: [admin, operator, viewer] }
            authEnabled: { type: boolean }
            permissions: { type: array, items: { type: string } }
            username:
              type: string
            exp:
              type: integer
              format: int64
            iat:
              type: integer
              format: int64
    ApiTokenCreateRequest:
      type: object
      required: [name]
      properties:
        permissions:
          type: array
          items: { type: string }
          description: Subset of current account permissions. Omitted snapshots current permissions; empty array grants none. Effective permissions are intersected with current account permissions.
        name:
          type: string
          maxLength: 80
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    ApiTokenMetadata:
      type: object
      required: [id, name, subject, createdAt, expiresAt]
      properties:
        permissions: { type: array, items: { type: string } }
        id: { type: string }
        name: { type: string }
        subject: { type: string }
        createdAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        lastUsedAt: { type: integer, format: int64 }
        revokedAt: { type: integer, format: int64 }
    ApiTokenCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [token, tokenInfo]
          properties:
            token: { type: string }
            tokenInfo:
              $ref: '#/components/schemas/ApiTokenMetadata'
    ApiTokenListResponse:
      type: object
      required: [ok, data]
      properties:
        ok: { type: boolean, enum: [true] }
        data:
          type: object
          required: [tokens]
          properties:
            tokens:
              type: array
              items:
                $ref: '#/components/schemas/ApiTokenMetadata'
    HealthResponse:
      type: object
      required: [ok, listen, pid, uptimeSec, stream]
      properties:
        ok:
          type: boolean
        listen:
          type: string
        pid:
          type: integer
          format: int64
        uptimeSec:
          type: integer
          format: int64
        stream:
          type: object
          additionalProperties: true
    StreamStatusResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [pid, listen, startedAt, uptimeSec, stream, rates]
          properties:
            pid:
              type: integer
              format: int64
            listen:
              type: string
            startedAt:
              type: string
              format: date-time
            uptimeSec:
              type: integer
              format: int64
            stream:
              type: object
              additionalProperties: true
            rates:
              type: object
              additionalProperties:
                type: number
                format: double
    IdrResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [atUnixMs]
          properties:
            atUnixMs:
              type: integer
              format: int64
    SystemMetricsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [uptimeSec, pid, system]
          properties:
            uptimeSec:
              type: integer
              format: int64
            pid:
              type: integer
              format: int64
            system:
              type: object
              additionalProperties: true
    RestartResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [restarting, atUnixMs]
          properties:
            restarting:
              type: boolean
            atUnixMs:
              type: integer
              format: int64

    NetworkInterface:
      type: object
      required: [iface, type, mac, ip4, ip6, dhcp]
      properties:
        iface:
          type: string
        type:
          type: string
          description: wired|wifi
        mac:
          type: string
        ip4:
          type: string
          description: IPv4 with CIDR (e.g. 192.168.0.3/24)
        ip6:
          type: array
          description: Assigned IPv6 addresses in CIDR notation, including link-local addresses; tentative and failed addresses are excluded.
          items:
            type: string
          example: ["fd12::10/64", "fe80::20/64"]
        dhcp:
          type: boolean

    NetworkGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [protocol, http_port, https_port, interfaces]
          properties:
            protocol:
              type: string
              enum: [http, https]
            http_port:
              type: integer
              format: int32
            https_port:
              type: integer
              format: int32
            interfaces:
              type: array
              items:
                $ref: '#/components/schemas/NetworkInterface'

    RemoteAccessUplinkCandidate:
      type: object
      required: [device, type, state]
      properties:
        device:
          type: string
        connection:
          type: string
          nullable: true
        type:
          type: string
          description: nmcli device type (wifi|ethernet)
        state:
          type: string

    RemoteAccessDefaultRoute:
      type: object
      properties:
        via:
          type: string
          nullable: true
        dev:
          type: string
          nullable: true
        metric:
          type: integer
          format: int32
          nullable: true

    RemoteAccessUplinkGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [preferredInterface, candidates, defaultRoutes]
          properties:
            preferredInterface:
              type: string
            candidates:
              type: array
              items:
                $ref: '#/components/schemas/RemoteAccessUplinkCandidate'
            defaultRoutes:
              type: array
              items:
                $ref: '#/components/schemas/RemoteAccessDefaultRoute'

    WolDevice:
      type: object
      required: [name, mac]
      properties:
        name:
          type: string
        mac:
          type: string

    WolListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WolDevice'

    VPNServiceStatus:
      type: object
      required: [state, ip]
      properties:
        state:
          type: string
          description: systemctl is-active output (active|inactive|failed|...)
        ip:
          type: string

    VPNGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VPNServiceStatus'

    WireGuardConfigStatus:
      type: object
      required: [state, config, webrtcPublicHost]
      properties:
        state:
          type: string
        config:
          type: object
          required: [exists, path]
          properties:
            exists:
              type: boolean
            path:
              type: string
        webrtcPublicHost:
          type: object
          required: [effectiveHost, source]
          properties:
            effectiveHost:
              type: string
            source:
              type: string

    WireGuardConfigResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/WireGuardConfigStatus'

    TailscaleConfigInput:
      type: object
      properties:
        authKey:
          type: string
        controlURL:
          type: string
        hostname:
          type: string
        advertiseRoutes:
          type: string
        acceptRoutes:
          type: boolean

    TailscaleConfigStatus:
      type: object
      required: [enabled, state, ip, config]
      properties:
        enabled:
          type: boolean
        state:
          type: string
        ip:
          type: string
        config:
          type: object
          required: [authKeyConfigured, controlURL, hostname, advertiseRoutes, acceptRoutes]
          properties:
            authKeyConfigured:
              type: boolean
            controlURL:
              type: string
            hostname:
              type: string
            advertiseRoutes:
              type: string
            acceptRoutes:
              type: boolean

    TailscaleConfigResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/TailscaleConfigStatus'

    ZeroTierConfigInput:
      type: object
      properties:
        networkID:
          type: string

    ZeroTierConfigStatus:
      type: object
      required: [enabled, state, ip, config]
      properties:
        enabled:
          type: boolean
        state:
          type: string
        ip:
          type: string
        config:
          type: object
          required: [networkID, nodeID, networkName, networkStatus, joined]
          properties:
            networkID:
              type: string
            nodeID:
              type: string
            networkName:
              type: string
            networkStatus:
              type: string
            joined:
              type: boolean

    ZeroTierConfigResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/ZeroTierConfigStatus'

    PrometheusStateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [enable, endpoint]
          properties:
            enable:
              type: boolean
            endpoint:
              type: string

    DisplaySettings:
      type: object
      required: [mode, onBootTime, cycleInterval, displayTime, secondaryIP]
      properties:
        mode:
          type: string
        onBootTime:
          type: integer
          format: int32
        cycleInterval:
          type: integer
          format: int32
        displayTime:
          type: integer
          format: int32
        secondaryIP:
          type: string

    DisplayResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: '#/components/schemas/DisplaySettings'

    HidStatusResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [enabled, mouseMode, passThrough, jiggler, connection]
          properties:
            enabled:
              type: boolean
            mouseMode:
              type: string
              enum: [dual, absolute, relative, none]
            connection:
              $ref: '#/components/schemas/HidConnectionStatus'
            passThrough:
              type: object
              required: [enabled, wheelReverse]
              properties:
                enabled:
                  type: boolean
                wheelReverse:
                  type: boolean
            jiggler:
              type: object
              required: [intervalSec]
              properties:
                intervalSec:
                  type: integer
                  format: int32

    HidFunctionConnection:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [ready, disabled, not_ready, partial, error, unknown]
        reason:
          type: string
          description: Machine-readable reason; absent when ready.
    HidConnectionStatus:
      type: object
      description: |
        Passive USB/HID readiness, independent for keyboard and each mouse endpoint.
        Ready means the USB host configured the gadget and the active endpoint is open
        with no recorded last-write error. It does not prove host OS input delivery.
        Dual mouse mode is partial if exactly one required mouse endpoint is ready.
        Reading this status never sends keyboard or mouse reports.
      required: [usbState, keyboard, mouse]
      properties:
        usbState:
          type: string
          description: Linux UDC state, unbound, or unknown if state cannot be read.
        keyboard:
          $ref: '#/components/schemas/HidFunctionConnection'
        mouse:
          allOf:
            - $ref: '#/components/schemas/HidFunctionConnection'
            - type: object
              required: [mode, absolute, relative]
              properties:
                mode:
                  type: string
                  enum: [dual, absolute, relative, none]
                absolute:
                  $ref: '#/components/schemas/HidFunctionConnection'
                relative:
                  $ref: '#/components/schemas/HidFunctionConnection'

    HidEventRequest:
      type: object
      required: [type]
      description: |
        Request body for `/api/v1/hid/events`.

        Required fields by event type:
        - `keyboard`: `type`, `key`
        - `mouseButton`: `type`, `button`
        - `mouseMove`: `type`, `toX`, `toY`
        - `mouseRelative`: `type`, `deltaX`, `deltaY`
        - `mouseWheel`: `type`, `deltaX`, `deltaY`

        Optional fields:
        - `state` is valid for `keyboard` and `mouseButton`
        - `finish` is valid for `keyboard`
        - `toX`/`toY` can also be supplied for `mouseButton` and `mouseWheel` when absolute positioning matters
        - in `dual` mouse mode, omitting `toX`/`toY` for `mouseButton` and `mouseWheel` keeps the pointer in place
      properties:
        type:
          type: string
          enum: [keyboard, mouseButton, mouseMove, mouseRelative, mouseWheel]
          description: |
            Event type. Supported values:
            - keyboard: key, optional state, optional finish
            - mouseButton: button, optional state, optional toX/toY for absolute positioning
            - mouseMove: toX, toY
            - mouseRelative: deltaX, deltaY
            - mouseWheel: deltaX, deltaY, optional toX/toY for absolute positioning
        key:
          $ref: '#/components/schemas/HidKeyboardCode'
        state:
          type: boolean
          description: |
            Press state for keyboard and mouseButton events.
            When omitted, the server sends a tap/click (press then release).
            For keyboard events, true replaces the current state with the single key; false clears all keyboard keys.
        finish:
          type: boolean
          description: |
            For keyboard events, release the key right after a press when `state=true`.
            Has no effect when state is false or omitted. Ignored for other event types.
        button:
          type: string
          enum: [left, middle, right]
          description: Mouse button name for mouseButton events.
        toX:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Absolute X coordinate normalized to 0..1.
        toY:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Absolute Y coordinate normalized to 0..1.
        deltaX:
          type: number
          format: double
          description: Relative X movement or horizontal wheel delta depending on the event type.
        deltaY:
          type: number
          format: double
          description: Relative Y movement or vertical wheel delta depending on the event type.

    HidPasteRequest:
      type: object
      required: [sequence]
      properties:
        sequence:
          type: array
          minItems: 1
          maxItems: 1024
          description: |
            Ordered groups of simultaneous keys. Supply 1..1024 non-empty groups.
            Empty strings and empty groups are removed by the server before checking the group limit.
            Each group replaces the keyboard state, then is released before the next group.
          items:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/HidKeyboardCode'
        delay:
          type: integer
          format: int32
          default: 5
          description: |
            Hold time and post-release gap per group, in milliseconds.
            Omitted values and values below 5 use 5; values above 250 use 250.
            Each group takes approximately twice the effective delay plus processing time.

    HidShortcutRequest:
      type: object
      required: [shortcuts]
      properties:
        shortcuts:
          type: array
          minItems: 1
          description: One simultaneous chord, automatically released after approximately 35 ms.
          items:
            $ref: '#/components/schemas/HidKeyboardCode'

    HidKeyboardCode:
      type: string
      description: |
        Supported keyboard code values for `type=keyboard`.
        These follow browser `KeyboardEvent.code` naming, not printable characters.

        Examples:
        - letters: `KeyA`, `KeyB`, `KeyZ`
        - digits: `Digit0`, `Digit1`
        - modifiers: `ControlLeft`, `ShiftLeft`, `AltLeft`, `MetaLeft`
        - arrows: `ArrowUp`, `ArrowLeft`
        - numpad: `Numpad0`, `NumpadEnter`
      enum:
        - ControlLeft
        - ShiftLeft
        - AltLeft
        - MetaLeft
        - ControlRight
        - ShiftRight
        - AltRight
        - MetaRight
        - KeyA
        - KeyB
        - KeyC
        - KeyD
        - KeyE
        - KeyF
        - KeyG
        - KeyH
        - KeyI
        - KeyJ
        - KeyK
        - KeyL
        - KeyM
        - KeyN
        - KeyO
        - KeyP
        - KeyQ
        - KeyR
        - KeyS
        - KeyT
        - KeyU
        - KeyV
        - KeyW
        - KeyX
        - KeyY
        - KeyZ
        - Digit1
        - Digit2
        - Digit3
        - Digit4
        - Digit5
        - Digit6
        - Digit7
        - Digit8
        - Digit9
        - Digit0
        - Enter
        - Escape
        - Backspace
        - Tab
        - Space
        - Minus
        - Equal
        - BracketLeft
        - BracketRight
        - Backslash
        - NonUSHash
        - Semicolon
        - Quote
        - Backquote
        - Comma
        - Period
        - Slash
        - CapsLock
        - F1
        - F2
        - F3
        - F4
        - F5
        - F6
        - F7
        - F8
        - F9
