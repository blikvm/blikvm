  /api/v1/hid/events:
    post:
      x-permission: kvm.input
      tags: [hid]
      summary: Inject a single HID event
      description: |
        Unified single-event HID injection endpoint.

        Supported event types:
        - `keyboard`: send one keyboard key press/release/tap
        - `mouseButton`: send one mouse button press/release/click
        - `mouseMove`: move the pointer to an absolute normalized position
        - `mouseRelative`: move the pointer by a relative delta
        - `mouseWheel`: send one wheel scroll event

        Mouse mode behavior:
        - `mouseMove` requires server HID mouse mode `absolute` or `dual`
        - `mouseRelative` requires server HID mouse mode `relative` or `dual`
        - In `dual` mode, `mouseButton` and `mouseWheel` use the relative mouse gadget by default,
          so omitting `toX` and `toY` will not reposition the pointer
        - If `toX` and `toY` are provided for `mouseButton` or `mouseWheel`, the server switches to
          the absolute mouse gadget for that event

        Keyboard notes:
        - `key` uses browser-style `KeyboardEvent.code` values
        - when `state` is omitted, the server performs a tap (`press -> release`)
        - lock keys such as `CapsLock`, `NumLock`, and `ScrollLock` are handled as reliable taps
        - each keyboard event replaces the entire keyboard state; it does not add a held key
        - `state=false` releases all keyboard keys, not only `key`; a valid `key` is still required
        - ordinary key taps and `finish=true` clear all keyboard keys after approximately 35 ms; lock keys use their dedicated tap handling
        - `finish` only affects `state=true`; lock keys remain taps rather than held keys
        - use `/api/v1/hid/shortcuts` for one simultaneous chord and `/api/v1/hid/paste` for an ordered sequence
        - keyboard reports support up to six non-modifier keys, with modifier bits separate
        - success means input was submitted, not that the target application completed an action
      operationId: postHidEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HidEventRequest'
            examples:
              keyboardTap:
                summary: Tap the Delete key
                value:
                  type: keyboard
                  key: Delete
              keyboardPress:
                summary: Press ControlLeft and keep it down
                value:
                  type: keyboard
                  key: ControlLeft
                  state: true
              keyboardPressAndRelease:
                summary: Press Enter and release immediately
                value:
                  type: keyboard
                  key: Enter
                  state: true
                  finish: true
              mouseButtonClick:
                summary: Left click at the last absolute pointer position
                value:
                  type: mouseButton
                  button: left
              mouseMove:
                summary: Move the pointer to the screen center
                value:
                  type: mouseMove
                  toX: 0.5
                  toY: 0.5
              mouseRelative:
                summary: Move the pointer relatively
                value:
                  type: mouseRelative
                  deltaX: 24
                  deltaY: -12
              mouseWheel:
                summary: Scroll vertically
                value:
                  type: mouseWheel
                  deltaX: 0
                  deltaY: 120
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Input permission denied or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HID write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: HID disabled or mouse mode conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: HID unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/hid/paste:
    post:
      x-permission: kvm.input
      tags: [hid]
      summary: Send an ordered keyboard key-code sequence
      description: |
        Executes an ordered sequence of keyboard chords, not a plain-text paste.
        Each inner array contains keys pressed simultaneously. For each group the server:
        1. replaces the keyboard state with that group;
        2. holds it for the effective delay;
        3. releases all keyboard keys;
        4. waits for the same delay before starting the next group.

        At most 1024 non-empty groups are accepted after trimming whitespace and removing empty groups.
        The integer delay is in milliseconds, defaults to an effective 5 ms, and is clamped to 5..250 ms.
        Timing is approximate and includes HID writes and scheduling overhead.
        Keys follow HidKeyboardCode; each report supports six non-modifier keys plus modifier bits.
        A modifier is not preserved between groups: repeat it in every group that needs it.

        The request remains open until execution finishes. Serialize requests and split longer input into
        batches, waiting for each batch to finish. This is not an asynchronous job or a clipboard transfer.
        The server attempts to clear keyboard state on exit. On errors or disconnects, input may have
        partially executed; inspect the target before retrying to avoid duplicate input.
        A successful response does not prove that the target application completed an action.
        Legacy text/lang fields are not the request format; callers must convert text to code groups
        according to the target keyboard layout. Arbitrary Unicode/IME conversion is not provided here.
      operationId: postHidPaste
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HidPasteRequest'
            examples:
              lettersAndEnter:
                summary: Tap A, B, Shift+C, then Enter on a US layout
                value:
                  delay: 35
                  sequence: [[KeyA], [KeyB], [ShiftLeft, KeyC], [Enter]]
              repeatedKey:
                summary: Three separate taps of A
                value:
                  delay: 35
                  sequence: [[KeyA], [KeyA], [KeyA]]
              chordsInOrder:
                summary: Ctrl+A followed by Ctrl+C, with a release between them
                value:
                  delay: 50
                  sequence: [[ControlLeft, KeyA], [ControlLeft, KeyC]]
      responses:
        '200':
          description: Sequence finished and keyboard released; target application completion is not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Invalid JSON, missing or empty input, or more than 1024 non-empty sequence groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Input permission denied or revoked during execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: HID disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HID write failed; earlier input may already have been sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: HID unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/hid/shortcuts:
    post:
      x-permission: kvm.input
      tags: [hid]
      summary: Tap one simultaneous keyboard chord
      description: |
        Presses all shortcuts keys together, holds for approximately 35 ms, then releases all keyboard keys.
        The array is one chord, not an ordered sequence. There is no configurable hold duration.
        Each request replaces the current keyboard state; modifiers from previous requests are not preserved.
        Use /api/v1/hid/paste for an ordered sequence with a configurable per-group delay.
        Use HidKeyboardCode strings, not numeric keyCode, printable characters or shortcut names such as Ctrl+C.
        Reports support six non-modifier keys plus modifier bits. Serialize input across clients.
        Success indicates input submission, not completion by the target application.
      operationId: postHidShortcuts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HidShortcutRequest'
            examples:
              copy:
                summary: Ctrl+C
                value:
                  shortcuts: [ControlLeft, KeyC]
              ctrlAltDelete:
                summary: Ctrl+Alt+Delete
                value:
                  shortcuts: [ControlLeft, AltLeft, Delete]
      responses:
        '200':
          description: Chord submitted and keyboard released; target application completion is not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Invalid JSON, missing or empty input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Input permission denied or revoked during execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: HID disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: HID write failed; earlier input may already have been sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: HID unavailable
          content:
