                      appTarget: {type: string, description: Signed application hardware family}
                      systemTarget: {type: string, nullable: true, description: Running OS image target; null when missing or conflicting}
                      systemTargetReason: {type: string, description: Identity failure reason; empty when resolved}
                      runningVersion: {type: string}
                      systemVersion: {type: string}
                      systemSlot: {type: string}
                      busy: {type: boolean}
                      deviceTime: {type: string, format: date-time}
