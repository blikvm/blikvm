    MsdStateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [imagesDir, service, storage, mounted]
          properties:
            imagesDir:
              type: string
            service:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
            storage:
              type: object
              required: [total, used, avail]
              properties:
                total:
                  type: integer
                  format: int64
                used:
                  type: integer
                  format: int64
                avail:
                  type: integer
                  format: int64
            mounted:
              type: object
              required: [name, cdrom, readOnly]
              properties:
                name:
                  type: string
                cdrom:
                  type: boolean
                readOnly:
                  type: boolean

    MsdImagesResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                required: [name, size]
                properties:
                  name:
                    type: string
                  size:
                    type: integer
                    format: int64

    USBCameraConfig:
      type: object
      required: [enabled, device, width, height, fps, bitrate]
      properties:
        enabled:
          type: boolean
        device:
          type: string
          description: V4L2 device path (e.g., /dev/video1)
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        fps:
          type: integer
          format: int32
        bitrate:
          type: integer
          format: int32
          description: Bitrate in kbps

