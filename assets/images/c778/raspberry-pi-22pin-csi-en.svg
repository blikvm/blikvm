<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="850" viewBox="0 0 1040 850" role="img" aria-labelledby="title"><title id="title">C778 raspberry-pi-22pin-csi reference diagram</title><rect width="100%" height="100%" rx="16" fill="#f6f9f7" /><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="42" font-size="27" fill="#173f32" font-weight="700">Raspberry Pi 22-pin CSI-2 pinout</text><text x="32" y="75" font-size="14" fill="#526b60" font-weight="400">Logical order: pin 1 to pin 22. Not a connector top view or solder-side view.</text><text x="48" y="120" font-size="15" fill="#526b60" font-weight="400">Pin</text><text x="128" y="120" font-size="15" fill="#526b60" font-weight="400">Signal</text><text x="335" y="120" font-size="15" fill="#526b60" font-weight="400">Function</text><rect x="36" y="136" width="526" height="27" rx="3" fill="#eef1ef" /><text x="54" y="155" font-size="16" fill="#173f32" font-weight="600">1</text><text x="128" y="155" font-size="16" fill="#173f32" font-weight="500">GND</text><text x="335" y="155" font-size="15" fill="#173f32" font-weight="400">Ground</text><rect x="36" y="165" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="184" font-size="16" fill="#173f32" font-weight="600">2</text><text x="128" y="184" font-size="16" fill="#173f32" font-weight="500">CAM_DN0</text><text x="335" y="184" font-size="15" fill="#173f32" font-weight="400">Data Lane 0 −</text><rect x="36" y="194" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="213" font-size="16" fill="#173f32" font-weight="600">3</text><text x="128" y="213" font-size="16" fill="#173f32" font-weight="500">CAM_DP0</text><text x="335" y="213" font-size="15" fill="#173f32" font-weight="400">Data Lane 0 +</text><rect x="36" y="223" width="526" height="27" rx="3" fill="#eef1ef" /><text x="54" y="242" font-size="16" fill="#173f32" font-weight="600">4</text><text x="128" y="242" font-size="16" fill="#173f32" font-weight="500">GND</text><text x="335" y="242" font-size="15" fill="#173f32" font-weight="400">Ground</text><rect x="36" y="252" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="271" font-size="16" fill="#173f32" font-weight="600">5</text><text x="128" y="271" font-size="16" fill="#173f32" font-weight="500">CAM_DN1</text><text x="335" y="271" font-size="15" fill="#173f32" font-weight="400">Data Lane 1 −</text><rect x="36" y="281" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="300" font-size="16" fill="#173f32" font-weight="600">6</text><text x="128" y="300" font-size="16" fill="#173f32" font-weight="500">CAM_DP1</text><text x="335" y="300" font-size="15" fill="#173f32" font-weight="400">Data Lane 1 +</text><rect x="36" y="310" width="526" height="27" rx="3" fill="#eef1ef" /><text x="54" y="329" font-size="16" fill="#173f32" font-weight="600">7</text><text x="128" y="329" font-size="16" fill="#173f32" font-weight="500">GND</text><text x="335" y="329" font-size="15" fill="#173f32" font-weight="400">Ground</text><rect x="36" y="339" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="358" font-size="16" fill="#173f32" font-weight="600">8</text><text x="128" y="358" font-size="16" fill="#173f32" font-weight="500">CAM_CN</text><text x="335" y="358" font-size="15" fill="#173f32" font-weight="400">Clock −</text><rect x="36" y="368" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="387" font-size="16" fill="#173f32" font-weight="600">9</text><text x="128" y="387" font-size="16" fill="#173f32" font-weight="500">CAM_CP</text><text x="335" y="387" font-size="15" fill="#173f32" font-weight="400">Clock +</text><rect x="36" y="397" width="526" height="27" rx="3" fill="#eef1ef" /><text x="54" y="416" font-size="16" fill="#173f32" font-weight="600">10</text><text x="128" y="416" font-size="16" fill="#173f32" font-weight="500">GND</text><text x="335" y="416" font-size="15" fill="#173f32" font-weight="400">Ground</text><rect x="36" y="426" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="445" font-size="16" fill="#173f32" font-weight="600">11</text><text x="128" y="445" font-size="16" fill="#173f32" font-weight="500">CAM_DN2</text><text x="335" y="445" font-size="15" fill="#173f32" font-weight="400">Data Lane 2 −</text><rect x="36" y="455" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="474" font-size="16" fill="#173f32" font-weight="600">12</text><text x="128" y="474" font-size="16" fill="#173f32" font-weight="500">CAM_DP2</text><text x="335" y="474" font-size="15" fill="#173f32" font-weight="400">Data Lane 2 +</text><rect x="36" y="484" width="526" height="27" rx="3" fill="#eef1ef" /><text x="54" y="503" font-size="16" fill="#173f32" font-weight="600">13</text><text x="128" y="503" font-size="16" fill="#173f32" font-weight="500">GND</text><text x="335" y="503" font-size="15" fill="#173f32" font-weight="400">Ground</text><rect x="36" y="513" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="532" font-size="16" fill="#173f32" font-weight="600">14</text><text x="128" y="532" font-size="16" fill="#173f32" font-weight="500">CAM_DN3</text><text x="335" y="532" font-size="15" fill="#173f32" font-weight="400">Data Lane 3 −</text><rect x="36" y="542" width="526" height="27" rx="3" fill="#def1e7" /><text x="54" y="561" font-size="16" fill="#173f32" font-weight="600">15</text><text x="128" y="561" font-size="16" fill="#173f32" font-weight="500">CAM_DP3</text><text x="335" y="561" font-size="15" fill="#173f32" font-weight="400">Data Lane 3 +</text><rect x="36" y="571" width="526" height="27" rx="3" fill="#eef1ef" /><text x="54" y="590" font-size="16" fill="#173f32" font-weight="600">16</text><text x="128" y="590" font-size="16" fill="#173f32" font-weight="500">GND</text><text x="335" y="590" font-size="15" fill="#173f32" font-weight="400">Ground</text><rect x="36" y="600" width="526" height="27" rx="3" fill="#e6edfc" /><text x="54" y="619" font-size="16" fill="#173f32" font-weight="600">17</text><text x="128" y="619" font-size="16" fill="#173f32" font-weight="500">CAM_IO0</text><text x="335" y="619" font-size="15" fill="#173f32" font-weight="400">Host auxiliary GPIO</text><rect x="36" y="629" width="526" height="27" rx="3" fill="#e6edfc" /><text x="54" y="648" font-size="16" fill="#173f32" font-weight="600">18</text><text x="128" y="648" font-size="16" fill="#173f32" font-weight="500">CAM_IO1</text><text x="335" y="648" font-size="15" fill="#173f32" font-weight="400">Host auxiliary GPIO</text><rect x="36" y="658" width="526" height="27" rx="3" fill="#eef1ef" /><text x="54" y="677" font-size="16" fill="#173f32" font-weight="600">19</text><text x="128" y="677" font-size="16" fill="#173f32" font-weight="500">GND</text><text x="335" y="677" font-size="15" fill="#173f32" font-weight="400">Ground</text><rect x="36" y="687" width="526" height="27" rx="3" fill="#e6edfc" /><text x="54" y="706" font-size="16" fill="#173f32" font-weight="600">20</text><text x="128" y="706" font-size="16" fill="#173f32" font-weight="500">SCL</text><text x="335" y="706" font-size="15" fill="#173f32" font-weight="400">I²C clock</text><rect x="36" y="716" width="526" height="27" rx="3" fill="#e6edfc" /><text x="54" y="735" font-size="16" fill="#173f32" font-weight="600">21</text><text x="128" y="735" font-size="16" fill="#173f32" font-weight="500">SDA</text><text x="335" y="735" font-size="15" fill="#173f32" font-weight="400">I²C data</text><rect x="36" y="745" width="526" height="27" rx="3" fill="#fff0d9" /><text x="54" y="764" font-size="16" fill="#173f32" font-weight="600">22</text><text x="128" y="764" font-size="16" fill="#173f32" font-weight="500">3V3</text><text x="335" y="764" font-size="15" fill="#173f32" font-weight="400">Raspberry Pi 3.3V</text><text x="610" y="175" font-size="22" fill="#173f32" font-weight="700">Video direction</text><text x="610" y="214" font-size="17" fill="#173f32" font-weight="400">C778 CSI output → Raspberry Pi input</text><text x="610" y="264" font-size="19" fill="#173f32" font-weight="600">4 data lanes + 1 clock lane</text><text x="610" y="300" font-size="17" fill="#526b60" font-weight="400">Each lane is a differential signal pair.</text><text x="610" y="365" font-size="22" fill="#173f32" font-weight="700">I²C and auxiliary signals</text><text x="610" y="403" font-size="18" fill="#173f32" font-weight="400">20 / 21: SCL / SDA</text><text x="610" y="439" font-size="18" fill="#173f32" font-weight="400">17 / 18: CAM_IO0 / CAM_IO1</text><text x="610" y="475" font-size="16" fill="#526b60" font-weight="400">Check board-specific auxiliary GPIO functions.</text><text x="610" y="544" font-size="22" fill="#173f32" font-weight="700">Separate power connections</text><text x="610" y="582" font-size="18" fill="#173f32" font-weight="400">Pin 22: Raspberry Pi 3.3V</text><text x="610" y="618" font-size="18" fill="#173f32" font-weight="400">C778: dedicated 5V power input</text><text x="610" y="654" font-size="17" fill="#9a4b25" font-weight="400">Do not connect 5V to pin 22.</text><text x="32" y="824" font-size="14" fill="#526b60" font-weight="400">Standard Raspberry Pi CSI signal order. Verify pin 1 and FPC contact orientation at both ends.</text></g></svg>