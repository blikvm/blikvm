<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="478" viewBox="0 0 1030 478" role="img" aria-labelledby="title"><title id="title">C778 双路 CSI split 输出模式</title><rect width="100%" height="100%" rx="16" fill="#f6f9f7"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><text x="32" y="42" font-size="27" fill="#173f32" font-weight="700">可选：左右半幅输出</text><text x="32" y="76" font-size="18" fill="#526b60" font-weight="400">同一个 HDMI 输入分成左右两半，主机按对应关系拼接</text><text x="44" y="151" font-size="19" fill="#173f32" font-weight="600">HDMI 输入</text><rect x="44" y="168" width="220" height="130" rx="8" fill="#deeee7" stroke="#589f81" stroke-width="2"/><path d="M154.0 168V298" stroke="#589f81" stroke-width="2"/><text x="79.2" y="236.9" font-size="25" fill="#173f32" font-weight="700">L</text><text x="191.4" y="236.9" font-size="25" fill="#173f32" font-weight="700">R</text><text x="44" y="329" font-size="17" fill="#173f32" font-weight="400">示例：1920 × 1080</text><path d="M276 232H344M334 224L344 232L334 240" fill="none" stroke="#598e76" stroke-width="3"/><rect x="355" y="183" width="192" height="100" rx="10" fill="#163e31"/><text x="380" y="225" font-size="23" fill="white" font-weight="600">LT6911UXE</text><text x="408" y="255" font-size="18" fill="#b9dcca" font-weight="400">C778</text><path d="M558 232H590V157H628M590 232V313H628M618 149L628 157L618 165M618 305L628 313L618 321" fill="none" stroke="#598e76" stroke-width="3"/><text x="654" y="110" font-size="19" fill="#173f32" font-weight="600">一路 CSI：左半幅</text><rect x="654" y="123" width="90" height="94" rx="8" fill="#deeee7" stroke="#589f81" stroke-width="2"/><text x="670.2" y="172.82" font-size="23" fill="#173f32" font-weight="700">L</text><text x="764" y="177" font-size="17" fill="#173f32" font-weight="400">960 × 1080</text><text x="654" y="266" font-size="19" fill="#173f32" font-weight="600">另一路 CSI：右半幅</text><rect x="654" y="279" width="90" height="94" rx="8" fill="#deeee7" stroke="#589f81" stroke-width="2"/><text x="670.2" y="328.82" font-size="23" fill="#173f32" font-weight="700">R</text><text x="764" y="333" font-size="17" fill="#173f32" font-weight="400">960 × 1080</text><text x="32" y="418" font-size="18" fill="#173f32" font-weight="400">MIPI0 / MIPI1 与左右半幅的具体对应关系以所用固件为准。</text><text x="32" y="451" font-size="16" fill="#526b60" font-weight="400">图示为画面组织方式；实际输出时序、格式和帧率取决于固件与主机配置。</text></g></svg>